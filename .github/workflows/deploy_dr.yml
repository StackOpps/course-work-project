name: "Deploy Backup Infrastructure"

on:
 workflow_dispatch:
    inputs:
      Deploy:
        description: "Whether to deploy the Terraform plan"
        required: true
        type: boolean
        default: true
      aws-region:
        description: "Overrides TF_VAR_aws-region for this run, e.g. to re-Deploy infra/ against the DR region during a failover"
        type: string
        default: eu-west-1
      environment:
        description: "GitHub environment to run the job under (optional)"
        type: string
        default: backup
   

permissions:
  id-token: write
  contents: read
jobs:
  terraform-deploy:
    uses: ./.github/workflows/_terraform.yml
    with:
      working-directory: backup/
      Deploy: true
      aws-region: eu-west-1
      environment: backup
    secrets:
      AWS_ACCESS_KEY_PLATFORM: ${{ secrets.AWS_ACCESS_KEY_PLATFORM }}
      AWS_ACCESS_SECRET_KEY_PLATFORM: ${{ secrets.AWS_ACCESS_SECRET_KEY_PLATFORM }}