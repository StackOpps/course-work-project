name: "Deploy DR Vault"

on:
  push:
    branches:
      - main
    paths:
      - "backup/**"
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

jobs:
  terraform-apply:
    uses: ./.github/workflows/_terraform.yml
    with:
      working-directory: backup
      backend-key: backup.tfstate
      apply: true
      environment: production
    secrets:
      AWS_TERRAFORM_ROLE_ARN: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
