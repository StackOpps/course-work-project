name: "Seed Realistic Data"

on:
  workflow_dispatch:
    inputs:
      rows:
        description: "Number of fake signups to insert"
        required: true
        type: number
        default: 500

permissions:
  id-token: write
  contents: read

jobs:
  seed:
    runs-on: ubuntu-latest
    environment: development
    timeout-minutes: 15
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_PLATFORM }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_ACCESS_SECRET_KEY_PLATFORM }}
      AWS_DEFAULT_REGION: eu-west-2
    steps:
      - name: Find the running web instance
        id: instance
        run: |
          set -euo pipefail
          id=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=crafthaven-*-web" "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" --output text)
          if [ "$id" == "None" ] || [ -z "$id" ]; then
            echo "No running web instance found — deploy infra/ first" >&2
            exit 1
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

      - name: Find the assets bucket
        id: bucket
        run: |
          set -euo pipefail
          name=$(aws s3api list-buckets \
            --query "Buckets[?starts_with(Name, 'crafthaven-') && contains(Name, '-assets-')].Name | [0]" \
            --output text)
          if [ "$name" == "None" ] || [ -z "$name" ]; then
            echo "No assets bucket found — deploy infra/ first" >&2
            exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Run seed.php on the instance via SSM
        run: |
          set -euo pipefail
          # The instance only syncs the assets bucket to /usr/share/nginx/html
          # once, at boot (see compute.tf user_data). If seed.php landed in
          # the bucket after this instance was already running, it's missing
          # on disk until re-synced — so do that before invoking it.
          #
          # DB_HOST/DB_NAME/DB_USER/DB_PASSWORD_B64 are likewise only wired up
          # for the php-fpm pool (compute.tf's env[...] directives in
          # www.conf), not for a plain CLI shell, so pull them out of that
          # ini file before invoking seed.php as a CLI script — otherwise
          # db.php's getenv() calls return empty and PDO falls back to a
          # local socket that doesn't exist ("SQLSTATE[HY000] [2002]").
          cat > params.json <<'PARAMS'
          {
            "commands": [
              "aws s3 sync s3://${{ steps.bucket.outputs.name }} /usr/share/nginx/html",
              "awk -F'\"' '/^env\\[DB_/{split($1,a,\"[\"); split(a[2],b,\"]\"); print \"export \" b[1] \"=\\\"\" $2 \"\\\"\"}' /etc/php-fpm.d/www.conf > /tmp/crafthaven-db.env",
              "bash -c 'source /tmp/crafthaven-db.env; php /usr/share/nginx/html/seed.php ${{ inputs.rows }}'"
            ]
          }
          PARAMS

          command_id=$(aws ssm send-command \
            --instance-ids "${{ steps.instance.outputs.id }}" \
            --document-name "AWS-RunShellScript" \
            --parameters file://params.json \
            --query "Command.CommandId" --output text)
          echo "SSM command $command_id sent"

          while :; do
            status=$(aws ssm get-command-invocation \
              --command-id "$command_id" --instance-id "${{ steps.instance.outputs.id }}" \
              --query "Status" --output text 2>/dev/null || echo "Pending")
            echo "seed.php: $status"
            case "$status" in
              Success|Failed|Cancelled|TimedOut) break ;;
            esac
            sleep 5
          done

          aws ssm get-command-invocation \
            --command-id "$command_id" --instance-id "${{ steps.instance.outputs.id }}" \
            --query "{stdout:StandardOutputContent,stderr:StandardErrorContent}" --output json

          [ "$status" == "Success" ]
