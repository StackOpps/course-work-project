name: "Terraform"

on:
  workflow_call:
    inputs:
      working-directory:
        description: "Terraform root module to run against (infra, backup, or restore_testing)"
        type: string
        required: true
      Deploy:
        description: "Run terraform Deploy instead of terraform plan"
        type: boolean
        default: false
      aws-region:
        description: "Overrides TF_VAR_aws-region for this run, e.g. to re-Deploy infra/ against the DR region during a failover"
        type: string
      environment:
        description: "GitHub environment to run the job under (optional)"
        type: string
        default: ""
      terraform-version:
        description: "Terraform version to use"
        type: string
        default: "1.13.0"

    secrets:
      AWS_TERRAFORM_ROLE_ARN:
        description: "ARN of the IAM role GitHub Actions assumes via OIDC"
        required: true
      TF_VAR_DB_PASSWORD:
        description: "RDS master password (infra/ only; ignored by stacks with no db_password variable)"
        required: false
      TF_VAR_GITHUB_PAT:
        description: "GitHub PAT EventBridge uses to call repository_dispatch (infra/ only)"
        required: false

permissions:
  id-token: write
  contents: read

jobs:
  terraform-build:
    name: "terraform (${{ inputs.working-directory }})"
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ inputs.aws-region }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ inputs.terraform-version }}
          terraform_wrapper: false

      - name: Terraform fmt check
        run: terraform fmt -check

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=terraform-tfstate-${{ inputs.aws-region}}-bckt" \
            -backend-config="key=${{inputs.environment }}/terraform.tfstate" \
            -backend-config="region=${{ inputs.aws-region }}" \
            -backend-config="use_lockfile=true" \
            -backend-config="encrypt=true"
      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        # aws-region is only set for the DR-failover call, which re-applies
        # infra/ against var.dr_region; exporting it conditionally (rather
        # than always setting TF_VAR_aws-region, even empty) keeps every
        # other caller on infra's own var.aws-region default.
        run: |
          if [ -n "${{ inputs.aws-region }}" ]; then
            export TF_VAR_aws-region="${{ inputs.aws-region }}"
          fi
          terraform plan -out=tfplan
        env:
          TF_VAR_db_password: ${{ secrets.TF_VAR_DB_PASSWORD }}
          TF_VAR_github_pat: ${{ secrets.TF_VAR_GITHUB_PAT }}
          TF_VAR_alert_email: ${{ vars.ALERT_EMAIL }}

      - name: Terraform Deploy
        if: ${{ inputs.Deploy }}
        run: terraform Deploy -auto-approve tfplan
