name: "Terraform"

on:
  workflow_call:
    inputs:
      working-directory:
        description: "Terraform root module to run against (infra, backup, or restore_testing)"
        type: string
        required: true
      backend-key:
        description: "S3 backend state key for this stack, e.g. infra.tfstate"
        type: string
        required: true
      apply:
        description: "Run terraform apply instead of terraform plan"
        type: boolean
        default: false
      target-region:
        description: "Overrides TF_VAR_aws_region for this run, e.g. to re-apply infra/ against the DR region during a failover"
        type: string
        default: ""
      environment:
        description: "GitHub environment to run the job under (optional)"
        type: string
        default: ""

    secrets:
      AWS_TERRAFORM_ROLE_ARN:
        description: "ARN of the IAM role GitHub Actions assumes via OIDC"
        required: true
      TF_VAR_DB_PASSWORD:
        description: "RDS master password (infra/ only; ignored by stacks with no db_password variable)"
        required: false
      TF_VAR_GITHUB_PAT:
        description: "GitHub PAT EventBridge uses to call repository_dispatch (infra/ only)"
        required: false

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    name: "terraform (${{ inputs.working-directory }})"
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: Terraform fmt check
        run: terraform fmt -check

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ inputs.backend-key }}" \
            -backend-config="region=${{ vars.TF_STATE_REGION }}" \
            -backend-config="dynamodb_table=${{ vars.TF_STATE_LOCK_TABLE }}" \
            -backend-config="encrypt=true"

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        # target-region is only set for the DR-failover call, which re-applies
        # infra/ against var.dr_region; exporting it conditionally (rather
        # than always setting TF_VAR_aws_region, even empty) keeps every
        # other caller on infra's own var.aws_region default.
        run: |
          if [ -n "${{ inputs.target-region }}" ]; then
            export TF_VAR_aws_region="${{ inputs.target-region }}"
          fi
          terraform plan -out=tfplan
        env:
          TF_VAR_db_password: ${{ secrets.TF_VAR_DB_PASSWORD }}
          TF_VAR_github_pat: ${{ secrets.TF_VAR_GITHUB_PAT }}
          TF_VAR_alert_email: ${{ vars.ALERT_EMAIL }}
          TF_VAR_route53_zone_name: ${{ vars.ROUTE53_ZONE_NAME }}
          TF_VAR_app_domain_name: ${{ vars.APP_DOMAIN_NAME }}
          TF_VAR_github_owner: ${{ vars.GITHUB_OWNER }}
          TF_VAR_github_repo: ${{ vars.GITHUB_REPO }}

      - name: Terraform Apply
        if: ${{ inputs.apply }}
        run: terraform apply -auto-approve tfplan
