name: "Terraform"

on:
  workflow_call:
    inputs:
      working-directory:
        description: "Terraform root module to run against (infra, backup, or restore_testing)"
        type: string
        required: true
      Deploy-Infra:
        description: "Run terraform Deploy instead of terraform plan"
        type: boolean
        default: false
      Deploy-restore-testing:
        description: "Run terraform Deploy instead of terraform plan"
        type: boolean
        default: false
      Deploy-Backup:
        description: "Run terraform Deploy instead of terraform plan"
        type: boolean
        default: false
      Destroy-infra:
        description: "Run terraform destroy instead of terraform plan"
        type: boolean
        default: false
      aws-region:
        description: "Overrides TF_VAR_aws-region for this run, e.g. to re-Deploy infra/ against the DR region during a failover"
        type: string
        default: "eu-west-2"
      environment:
        description: "GitHub environment to run the job under (optional)"
        type: string
        default: ""
      state-key:
        description: "Terraform state key prefix (defaults to the environment name); override to keep a second apply of the same working-directory off the primary state, e.g. a DR re-apply of infra/"
        type: string
        default: ""
      db-snapshot-identifier:
        description: "AWS Backup recovery point ARN to restore the RDS instance from instead of creating it empty (infra/ only; ignored by stacks with no db_snapshot_identifier variable)"
        type: string
        default: ""
      empty-backup-vaults:
        description: "Before destroying, delete all recovery points from the primary_vault_arn/dr_vault_arn outputs so the vaults themselves can be destroyed (backup/ only; AWS Backup refuses to delete a non-empty vault and Terraform has no force_destroy for it)"
        type: boolean
        default: false
      terraform-version:
        description: "Terraform version to use"
        type: string
        default: "1.13.0"

    outputs:
      alb_dns_name:
        description: "DNS name of the storefront load balancer (infra/ only; empty for stacks with no such output)"
        value: ${{ jobs.terraform-build.outputs.alb_dns_name }}
      alb_zone_id:
        description: "Hosted zone ID of the storefront load balancer (infra/ only; empty for stacks with no such output)"
        value: ${{ jobs.terraform-build.outputs.alb_zone_id }}

    secrets:
      AWS_ACCESS_KEY_PLATFORM:
        required: true
      AWS_ACCESS_SECRET_KEY_PLATFORM:
        required: true
      TF_VAR_DB_PASSWORD:
        description: "RDS master password (infra/ only; ignored by stacks with no db_password variable)"
        required: false
      TF_VAR_GITHUB_PAT:
        description: "GitHub PAT EventBridge uses to call repository_dispatch (backup/ only)"
        required: false

permissions:
  id-token: write
  contents: read

jobs:
  terraform-build:
    name: "terraform (${{ inputs.working-directory }})"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.environment }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_PLATFORM }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_ACCESS_SECRET_KEY_PLATFORM }}
    outputs:
      alb_dns_name: ${{ steps.tf_outputs.outputs.alb_dns_name }}
      alb_zone_id: ${{ steps.tf_outputs.outputs.alb_zone_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ inputs.terraform-version }}
          terraform_wrapper: false

      - name: Terraform fmt check
        run: terraform fmt -check

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=terraform-tfstate-${{ inputs.aws-region}}-bckt" \
            -backend-config="key=${{ inputs.state-key != '' && inputs.state-key || inputs.environment }}/terraform.tfstate" \
            -backend-config="region=${{ inputs.aws-region }}" \
            -backend-config="use_lockfile=true" \
            -backend-config="encrypt=true"
      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        if : ${{ !inputs.Destroy-infra }}
        run: terraform plan -out=tfplan
        env:
          TF_VAR_aws_region: ${{ inputs.aws-region }}
          TF_VAR_db_password: ${{ secrets.TF_VAR_DB_PASSWORD }}
          TF_VAR_db_snapshot_identifier: ${{ inputs.db-snapshot-identifier }}
          TF_VAR_github_pat: ${{ secrets.TF_VAR_GITHUB_PAT }}
          TF_VAR_github_owner: ${{ vars.GITHUB_OWNER }}
          TF_VAR_github_repo: ${{ vars.GITHUB_REPO }}
          TF_VAR_alert_email: ${{ vars.ALERT_EMAIL }}
          TF_VAR_app_domain_name: ${{ vars.APP_DOMAIN_NAME }}

      - name: Terraform Deploy
        if: ${{ inputs.Deploy-Infra || inputs.Deploy-restore-testing || inputs.Deploy-Backup }}
        run: terraform apply -auto-approve tfplan

      - name: Read Terraform outputs
        id: tf_outputs
        if: ${{ inputs.Deploy-Infra }}
        run: |
          echo "alb_dns_name=$(terraform output -raw alb_dns_name 2>/dev/null || true)" >> "$GITHUB_OUTPUT"
          echo "alb_zone_id=$(terraform output -raw alb_zone_id 2>/dev/null || true)" >> "$GITHUB_OUTPUT"

      - name: Empty backup vaults before destroy
        if: ${{ inputs.Destroy-infra && inputs.empty-backup-vaults }}
        working-directory: ${{ github.workspace }}
        run: |
          for output in primary_vault_arn dr_vault_arn; do
            arn=$(terraform -chdir="${{ inputs.working-directory }}" output -raw "$output" 2>/dev/null || true)
            if [[ "$arn" != arn:aws:backup:* ]]; then
              echo "$output not in state (backup/ not deployed here yet) - skipping"
              continue
            fi
            python scripts/empty_backup_vault.py --vault-arn "$arn"
          done

      - name: Terraform Destroy
        if: ${{ inputs.Destroy-infra }}
        run: terraform destroy -auto-approve
        env:
          TF_VAR_aws_region: ${{ inputs.aws-region }}
          TF_VAR_db_password: ${{ secrets.TF_VAR_DB_PASSWORD }}
          TF_VAR_github_pat: ${{ secrets.TF_VAR_GITHUB_PAT }}
          TF_VAR_github_owner: ${{ vars.GITHUB_OWNER }}
          TF_VAR_github_repo: ${{ vars.GITHUB_REPO }}
          TF_VAR_alert_email: ${{ vars.ALERT_EMAIL }}
          TF_VAR_app_domain_name: ${{ vars.APP_DOMAIN_NAME }}


