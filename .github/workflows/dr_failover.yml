name: "DR Failover"

# Manually triggered only. The recovery mechanics — Terraform re-apply
# against the DR region, RDS restored from the latest AWS Backup recovery
# point (infra/database.tf's data lookup), then a DNS cutover — are
# identical whether started by a human or an automated site-down signal, so
# this repo doesn't wire up automatic detection; a button click on this
# workflow exercises the same path an alarm would.
#
# By default this drill restores whatever the latest snapshot happens to be,
# which has so far been a near-empty seed.php-scale DB — RTO measured
# against it understates a production-scale restore. RDS infers restore
# size from the snapshot, not from this run (infra/database.tf leaves
# allocated_storage unset on the DR apply), so there's no input here to
# make a single drill "realistic": size main.yml's db-allocated-storage
# input up, deploy infra/ against primary, run trigger_backup.yml to get a
# fresh snapshot at that size copied to the DR vault, then dispatch this
# workflow as normal.
on:
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

jobs:
  # Closest available proxy for "a failure was detected" (Section 3.4's RTO
  # start point) now that triggering is manual: timed at the start of this
  # run rather than at some external alarm's timestamp. Its own job so it
  # can run in parallel with provisioning below instead of blocking it.
  record-start-time:
    runs-on: ubuntu-latest
    outputs:
      failure_triggered_at: ${{ steps.trigger_time.outputs.failure_triggered_at }}
    steps:
      - name: Record when this drill started
        id: trigger_time
        run: echo "failure_triggered_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

  # RDS is the only tier with data that can't be reproduced from repo
  # content, so it's the only one that needs an explicit restore:
  #  - EC2 is stateless — user_data reinstalls nginx/php-fpm and re-syncs the
  #    storefront straight from S3 on every boot, so Terraform recreating
  #    the instance *is* the restore.
  #  - S3's only objects are Terraform-managed (aws_s3_object in
  #    infra/storage.tf) and get re-uploaded from the repo on every apply,
  #    in any region.
  # infra/database.tf finds the latest AWS Backup recovery point in this
  # region itself via a data source, so this is just a normal re-apply of
  # infra/ against the DR region — no separate lookup step or Terraform
  # variable needed.
  provision:
    uses: ./.github/workflows/_terraform.yml
    with:
      working-directory: infra/
      Deploy-Infra: true
      aws-region: ${{ vars.DR_REGION }}
      environment: development
      state-key: dr
    secrets:
      AWS_ACCESS_KEY_PLATFORM: ${{ secrets.AWS_ACCESS_KEY_PLATFORM }}
      AWS_ACCESS_SECRET_KEY_PLATFORM: ${{ secrets.AWS_ACCESS_SECRET_KEY_PLATFORM }}
      TF_VAR_DB_PASSWORD: ${{ secrets.TF_VAR_DB_PASSWORD }}

  failover:
    needs: [provision, record-start-time]
    runs-on: ubuntu-latest
    environment: development
    permissions:
      contents: write
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_PLATFORM }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_ACCESS_SECRET_KEY_PLATFORM }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install script dependencies
        run: pip install -r requirements.txt

      - name: Smoke check the DR environment
        run: |
          curl --fail --retry 10 --retry-delay 15 --retry-connrefused \
            "http://${{ needs.provision.outputs.alb_dns_name }}/"

      # The DNS cutover is an explicit, imperative step taken by this
      # workflow once smoke checks pass — not something Terraform apply does
      # as a side effect — so the primary-region state never has to know
      # about it (Section 3.3: "the workflow updates the Route 53 record").
      - name: Point Route 53 at the DR environment
        run: |
          aws route53 change-resource-record-sets \
            --hosted-zone-id "${{ vars.ROUTE53_ZONE_ID }}" \
            --change-batch '{
              "Changes": [{
                "Action": "UPSERT",
                "ResourceRecordSet": {
                  "Name": "${{ vars.APP_DOMAIN_NAME }}",
                  "Type": "A",
                  "AliasTarget": {
                    "HostedZoneId": "${{ needs.provision.outputs.alb_zone_id }}",
                    "DNSName": "${{ needs.provision.outputs.alb_dns_name }}",
                    "EvaluateTargetHealth": true
                  }
                }
              }]
            }'

      # Turns this drill into a permanent, plottable record (Section 3.4's
      # RTO/RPO evaluation) instead of a number that only ever existed in this
      # run's logs. docs/data/history.json is served by GitHub Pages
      # (docs/index.html), so every drill adds one point to that dashboard.
      - name: Record this drill's RTO/RPO
        run: |
          python scripts/record_dr_result.py \
            --resource-type ENV \
            --resource-id "${{ vars.APP_DOMAIN_NAME }}" \
            --failure-triggered-at "${{ needs.record-start-time.outputs.failure_triggered_at }}" \
            --recovery-point-created-at "${{ needs.provision.outputs.recovery_point_created_at }}" \
            --notes "Manual DR failover drill"

      - name: Publish result to the dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/history.json
          git commit -m "Record DR failover drill result [skip ci]"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"
