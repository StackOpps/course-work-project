name: "Deploy Infrastructure"

on:
  push:
    branches:
      - main
    paths:
      - "infra/**"

permissions:
  id-token: write
  contents: read
jobs:
  terraform-deploy-development:
    uses: ./.github/workflows/_terraform.yml
    with:
      working-directory: infra/
      Deploy: true
      environment: development
    secrets:
      AWS_ACCESS_KEY_PLATFORM: ${{ secrets.AWS_ACCESS_KEY_PLATFORM }}
      AWS_ACCESS_SECRET_KEY_PLATFORM: ${{ secrets.AWS_ACCESS_SECRET_KEY_PLATFORM }}
      TF_VAR_DB_PASSWORD: ${{ secrets.TF_VAR_DB_PASSWORD }}
      TF_VAR_GITHUB_PAT: ${{ secrets.TF_VAR_GITHUB_PAT }}