name: "Deploy Infrastructure"

on:
  push:
    branches:
      - main
    paths:
      - "infra/**"

permissions:
  id-token: write
  contents: read

jobs:
  terraform-apply:
    uses: ./.github/workflows/_terraform.yml
    with:
      working-directory: infra
      backend-key: infra.tfstate
      apply: true
      environment: production
    secrets:
      AWS_TERRAFORM_ROLE_ARN: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
      TF_VAR_DB_PASSWORD: ${{ secrets.TF_VAR_DB_PASSWORD }}
      TF_VAR_GITHUB_PAT: ${{ secrets.TF_VAR_GITHUB_PAT }}
