name: "Deployment"

on:
  workflow_dispatch:
      inputs:
        Deploy-Infra:
          description: "Deploy the Terraform plan for infra/"
          required: true
          type: boolean
          default: false
        Deploy-Backup:
          description: "Deploy the Terraform plan for backup/"
          required: true
          type: boolean
          default: false
        Deploy-RestoreTesting:
          description: "Deploy the Terraform plan for restore_testing/"
          required: true
          type: boolean
          default: false
        db-allocated-storage:
          description: "RDS storage (GB) for this primary-region apply. Bump this ahead of a trigger_backup.yml + dr_failover.yml run to size a DR drill's RDS restore realistically — the DR-region apply always inherits size from whichever snapshot it restores, so this only takes effect via a fresh backup taken after this deploy."
          required: true
          type: string
          default: "60"

permissions:
  id-token: write
  contents: read
jobs:
  terraform-deploy-infra:
    uses: ./.github/workflows/_terraform.yml
    if: ${{ inputs.Deploy-Infra }}
    with:
      working-directory: infra/
      Deploy-Infra: true
      aws-region: eu-west-2
      environment: development
      db-allocated-storage: ${{ inputs.db-allocated-storage }}
    secrets:
      AWS_ACCESS_KEY_PLATFORM: ${{ secrets.AWS_ACCESS_KEY_PLATFORM }}
      AWS_ACCESS_SECRET_KEY_PLATFORM: ${{ secrets.AWS_ACCESS_SECRET_KEY_PLATFORM }}
      TF_VAR_DB_PASSWORD: ${{ secrets.TF_VAR_DB_PASSWORD }}

  terraform-deploy-backup:
    uses: ./.github/workflows/_terraform.yml
    if: ${{ inputs.Deploy-Backup }}
    with:
      working-directory: backup/
      Deploy-Backup: true
      aws-region: eu-west-1
      environment: backup
    secrets:
      AWS_ACCESS_KEY_PLATFORM: ${{ secrets.AWS_ACCESS_KEY_PLATFORM }}
      AWS_ACCESS_SECRET_KEY_PLATFORM: ${{ secrets.AWS_ACCESS_SECRET_KEY_PLATFORM }}

  # backup/'s DR vault (this stack's recovery_point_selection target) must
  # already exist, so this only succeeds after terraform-deploy-backup has
  # run at least once — not made an explicit `needs` dependency since that
  # would force redeploying backup/ every time this is toggled on its own.
  terraform-deploy-restore-testing:
    uses: ./.github/workflows/_terraform.yml
    if: ${{ inputs.Deploy-RestoreTesting }}
    with:
      working-directory: restore_testing/
      Deploy-Backup: true
      aws-region: eu-west-1
      environment: backup
      state-key: restore-testing
    secrets:
      AWS_ACCESS_KEY_PLATFORM: ${{ secrets.AWS_ACCESS_KEY_PLATFORM }}
      AWS_ACCESS_SECRET_KEY_PLATFORM: ${{ secrets.AWS_ACCESS_SECRET_KEY_PLATFORM }}