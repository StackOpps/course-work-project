name: "Deploy Restore Testing Plan"

on:
  push:
    branches:
      - main
    paths:
      - "restore_testing/**"
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

jobs:
  terraform-apply:
    uses: ./.github/workflows/_terraform.yml
    with:
      working-directory: restore_testing
      backend-key: restore-testing.tfstate
      apply: true
      environment: production
    secrets:
      AWS_TERRAFORM_ROLE_ARN: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
