name: "Destroy Infrastructure"

on:
  workflow_dispatch:
    inputs:
      Destroy-Backup:
        description: "Also destroy backup/ (its vaults are Vault Lock-protected — this fails until a recovery point's 1-day minimum retention has passed)"
        required: true
        type: boolean
        default: false
  schedule:
    - cron: '1 */2 * * *' # Run every 2 hours, bounding cost on infra/ (EC2/RDS/ALB) and restore_testing/

permissions:
  id-token: write
  contents: read
jobs:
  terraform-destroy-infra:
    uses: ./.github/workflows/_terraform.yml
    with:
      working-directory: infra/
      Destroy-infra: true
      environment: development
      aws-region: eu-west-2
    secrets:
      AWS_ACCESS_KEY_PLATFORM: ${{ secrets.AWS_ACCESS_KEY_PLATFORM }}
      AWS_ACCESS_SECRET_KEY_PLATFORM: ${{ secrets.AWS_ACCESS_SECRET_KEY_PLATFORM }}
      TF_VAR_DB_PASSWORD: ${{ secrets.TF_VAR_DB_PASSWORD }}


  terraform-destroy-dr-infra:
    uses: ./.github/workflows/_terraform.yml
    with:
      working-directory: infra/
      Destroy-infra: true
      environment: development
      aws-region: ${{ vars.DR_REGION }}
      state-key: dr
    secrets:
      AWS_ACCESS_KEY_PLATFORM: ${{ secrets.AWS_ACCESS_KEY_PLATFORM }}
      AWS_ACCESS_SECRET_KEY_PLATFORM: ${{ secrets.AWS_ACCESS_SECRET_KEY_PLATFORM }}
      TF_VAR_DB_PASSWORD: ${{ secrets.TF_VAR_DB_PASSWORD }}

  # Torn down before backup/ below, since its restore-testing-plan references
  # the DR vault backup/ manages by ARN convention - not a Terraform
  # dependency, but destroying in this order avoids leaving a plan pointed at
  # a vault that's already gone. Same safe-no-op behaviour as the DR infra
  # job above when nothing's deployed here.
  terraform-destroy-restore-testing:
    uses: ./.github/workflows/_terraform.yml
    with:
      working-directory: restore_testing/
      Destroy-infra: true
      environment: backup
      aws-region: eu-west-1
      state-key: restore-testing
    secrets:
      AWS_ACCESS_KEY_PLATFORM: ${{ secrets.AWS_ACCESS_KEY_PLATFORM }}
      AWS_ACCESS_SECRET_KEY_PLATFORM: ${{ secrets.AWS_ACCESS_SECRET_KEY_PLATFORM }}

  # Not part of the scheduled 2-hourly teardown above: backup/'s vaults are
  # Vault Lock-protected (backup/vault.tf), so emptying them before their
  # recovery points' 1-day minimum retention has passed would just fail. The
  # vaults hold nothing but backup storage, not compute, so leaving them up
  # between runs doesn't meaningfully add to what infra/'s 2-hourly teardown
  # already bounds - this only runs on an explicit manual opt-in once that
  # retention window has actually elapsed.
  terraform-destroy-backup:
      uses: ./.github/workflows/_terraform.yml
      if: ${{ inputs.Destroy-Backup }}
      needs: [terraform-destroy-infra, terraform-destroy-restore-testing]
      with:
        working-directory: backup/
        Destroy-infra: true
        environment: backup
        aws-region: eu-west-1
        empty-backup-vaults: true
      secrets:
        AWS_ACCESS_KEY_PLATFORM: ${{ secrets.AWS_ACCESS_KEY_PLATFORM }}
        AWS_ACCESS_SECRET_KEY_PLATFORM: ${{ secrets.AWS_ACCESS_SECRET_KEY_PLATFORM }}
