name: "Destroy Infrastructure"

on:
  workflow_dispatch:
    inputs:
      Destroy-dr:
        description: "Destroy the DR-region infra/ stack (infra/ only"
        default: false
        type: boolean
      Destroy-infra:
        description: "Destroy the primary-region infra/ stack (infra/ only)"
        default: false
        type: boolean
      Destroy-backup:
        description: "Destroy the backup/ stack (backup/ only)"
        default: false
        type: boolean
      Destroy-restore-testing:
        description: "Destroy the restore_testing/ stack (restore_testing/ only)"
        default: false
        type: boolean
  # schedule:
  #   - cron: '1 */2 * * *' # Run every 2 hours

permissions:
  id-token: write
  contents: read
jobs:
  terraform-destroy-infra:
    uses: ./.github/workflows/_terraform.yml
    if : ${{ inputs.Destroy-infra }}
    with:
      working-directory: infra/
      Destroy-infra: true
      environment: development
      aws-region: eu-west-2
    secrets:
      AWS_ACCESS_KEY_PLATFORM: ${{ secrets.AWS_ACCESS_KEY_PLATFORM }}
      AWS_ACCESS_SECRET_KEY_PLATFORM: ${{ secrets.AWS_ACCESS_SECRET_KEY_PLATFORM }}
      TF_VAR_DB_PASSWORD: ${{ secrets.TF_VAR_DB_PASSWORD }}


  terraform-destroy-dr-infra:
    uses: ./.github/workflows/_terraform.yml
    if: ${{ inputs.Destroy-dr }}
    with:
      working-directory: infra/
      Destroy-infra: true
      environment: development
      aws-region: ${{ vars.DR_REGION }}
      state-key: dr
    secrets:
      AWS_ACCESS_KEY_PLATFORM: ${{ secrets.AWS_ACCESS_KEY_PLATFORM }}
      AWS_ACCESS_SECRET_KEY_PLATFORM: ${{ secrets.AWS_ACCESS_SECRET_KEY_PLATFORM }}
      TF_VAR_DB_PASSWORD: ${{ secrets.TF_VAR_DB_PASSWORD }}

  terraform-destroy-restore-testing:
    uses: ./.github/workflows/_terraform.yml
    if: 
    with:
      working-directory: restore_testing/
      Destroy-infra: true
      environment: backup
      aws-region: eu-west-1
      state-key: restore-testing
    secrets:
      AWS_ACCESS_KEY_PLATFORM: ${{ secrets.AWS_ACCESS_KEY_PLATFORM }}
      AWS_ACCESS_SECRET_KEY_PLATFORM: ${{ secrets.AWS_ACCESS_SECRET_KEY_PLATFORM }}

  terraform-destroy-backup:
      uses: ./.github/workflows/_terraform.yml
      needs: [terraform-destroy-infra, terraform-destroy-restore-testing]
      if: ${{ inputs.Destroy-backup }}
      with:
        working-directory: backup/
        Destroy-infra: true
        environment: backup
        aws-region: eu-west-1
        empty-backup-vaults: true
      secrets:
        AWS_ACCESS_KEY_PLATFORM: ${{ secrets.AWS_ACCESS_KEY_PLATFORM }}
        AWS_ACCESS_SECRET_KEY_PLATFORM: ${{ secrets.AWS_ACCESS_SECRET_KEY_PLATFORM }}
