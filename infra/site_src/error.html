<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CraftHaven — Page Not Found</title>
<style>
  :root {
    color-scheme: light dark;
    --ground: #e8e2d3;
    --surface: #f2eee1;
    --ink: #22281f;
    --muted: #5b5a4e;
    --accent: #a8701f;
    --accent-strong: #7d5316;
    --line: #d3cab2;
    --stitch: #8a8168;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ground: #171c15;
      --surface: #1f251b;
      --ink: #ece6d6;
      --muted: #b7ae98;
      --accent: #d59a3c;
      --accent-strong: #eab15a;
      --line: #333a2c;
      --stitch: #4c5342;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--ground);
    color: var(--ink);
    text-align: center;
    padding: 2rem;
  }
  a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .brand {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    font-size: 1.1rem;
    font-weight: 800;
    letter-spacing: -0.01em;
    text-decoration: none;
    color: var(--ink);
    margin-bottom: 2.5rem;
  }
  .brand svg { color: var(--accent); }
  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-top: 1px dashed var(--stitch);
    border-radius: 6px;
    padding: 3rem 2.5rem;
    max-width: 28rem;
  }
  .eyebrow {
    display: block;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    color: var(--accent);
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 0.9rem;
  }
  h1 { font-size: 1.7rem; font-weight: 800; letter-spacing: -0.01em; margin: 0 0 0.75rem; text-wrap: balance; }
  p { font-size: 1rem; color: var(--muted); line-height: 1.6; margin: 0 0 2rem; }
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 0.7rem 1.4rem;
    border-radius: 4px;
    background: var(--accent);
    color: var(--ground);
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    font-weight: 700;
    font-size: 0.76rem;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    text-decoration: none;
  }
  .btn:hover { background: var(--accent-strong); }
</style>
</head>
<body>
  <a class="brand" href="/">
    <svg width="24" height="24" viewBox="0 0 26 26" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect x="1.5" y="1.5" width="23" height="23" rx="3" stroke="currentColor" stroke-width="1.6"/>
      <path d="M7 7 L19 19 M19 7 L7 19" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
    </svg>
    CraftHaven
  </a>
  <div class="card">
    <span class="eyebrow">404 error</span>
    <h1>Page not found</h1>
    <p>The page you're looking for doesn't exist, or the workshop moved it. Let's get you back to the storefront.</p>
    <a class="btn" href="/">Return home</a>
  </div>
</body>
</html>
